<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Compatibility shim for browser extensions trying to set window.fetch
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var fetchHandler = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchHandler;
            },
            set: function(fn) {
              fetchHandler = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
    <title>KoreTube - Ricerca e Player Video YouTube</title>
    <meta name="description" content="KoreTube: Player semplice e veloce in stile YouTube per cercare e guardare qualsiasi video." />

    <meta property="og:description" content="KoreTube: Player semplice e veloce in stile YouTube per cercare e guardare qualsiasi video." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
